name: Build PokeSearch Android APK
on:
  push:
    branches: [pokesearch-overlay-alpha]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate JavaScript sources
        run: |
          node --check app/src/main/assets/probe.js
          node --check app/src/main/assets/presets.js
          node --check app/src/main/assets/shiny_login.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/assets/dock.html').read_text()
          assert text.count('<script>') == 1
          Path('/tmp/pokesearch-dock.js').write_text(text.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/pokesearch-dock.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('app/src/main/assets/pokemon_catalog.json').read_text())
          assert len(d)>1000 and d[0]==[1,"Bulbasaur"]
          print(f'Catálogo validado: {len(d)} espécies')
          PY
      - name: Assemble optimized unsigned release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate optimized release APK and export signing tools
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null
          mkdir -p delivery/tools
          cp app/build/outputs/apk/release/app-release-unsigned.apk delivery/PokeSearch-0.35-beta-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" delivery/tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" delivery/tools/zipalign
          sha256sum delivery/PokeSearch-0.35-beta-unsigned.apk > delivery/UNSIGNED_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-0.35-beta-unsigned-build
          path: delivery/
          retention-days: 30
