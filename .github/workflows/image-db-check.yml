name: Check PvPPokeGo image database (isolated)

on:
  push:
    branches: [preview/pokemon-image-db-20261015]
  pull_request:
    branches: [preview/home-mobile-0.5.37-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-image-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKM"
          "$SDKM" --install 'platforms;android-36' 'build-tools;36.0.0'
          yes | "$SDKM" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Package offline game data (existing production pipeline)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_offline_pvpoke_assets.py
          test -s app/src/main/assets/gamemaster.json
          test -s app/src/main/assets/pvpoke_snapshot.json
      - name: Build existing form-aware atlas and fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/package_visual_fingerprints.py
          test -s app/src/main/assets/pokemon_icon_atlas.png
          test -s app/src/main/assets/pokemon_icon_atlas.json
          test -s app/src/main/assets/pokemon_visual_fingerprints.json
      - name: Unit tests and Standard debug APK
        run: |
          gradle :app:testStandardDebugUnitTest :app:assembleStandardDebug --stacktrace
      - name: Verify offline APK packaging
        if: success()
        run: |
          unzip -t app/build/outputs/apk/standard/debug/app-standard-debug.apk >/dev/null
          unzip -Z1 app/build/outputs/apk/standard/debug/app-standard-debug.apk | grep -q '^assets/gamemaster.json
        if: success()
        run: sha256sum app/build/outputs/apk/standard/debug/*.apk | tee image-db-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PvPPokeGo-0.5.37-image-db-standard-debug
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            image-db-apk-sha256.txt
          if-no-files-found: error

          unzip -Z1 app/build/outputs/apk/standard/debug/app-standard-debug.apk | grep -q '^assets/pokemon_icon_atlas.png
        if: success()
        run: sha256sum app/build/outputs/apk/standard/debug/*.apk | tee image-db-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PvPPokeGo-0.5.37-image-db-standard-debug
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            image-db-apk-sha256.txt
          if-no-files-found: error

      - name: Record APK digest
        if: success()
        run: sha256sum app/build/outputs/apk/standard/debug/*.apk | tee image-db-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PvPPokeGo-0.5.37-image-db-standard-debug
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            image-db-apk-sha256.txt
          if-no-files-found: error
