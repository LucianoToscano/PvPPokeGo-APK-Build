name: Distribuir PvPPokeGo 0.5.41 protegido

on:
  push:
    branches: ['distribution/friends-0.5.41-protected-20261025']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  protected-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout distribution snapshot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify release source and offline identity
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "0.5.41-amigos"' app/build.gradle.kts
          grep -Fq 'versionCode = 47' app/build.gradle.kts
          grep -Fq 'isMinifyEnabled = true' app/build.gradle.kts
          grep -Fq 'isShrinkResources = true' app/build.gradle.kts
          grep -Fq 'isDebuggable = false' app/build.gradle.kts
          test -s app/src/main/res/drawable-nodpi/pvppokego_launcher.png
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Generate offline PvPoke assets
        run: |
          set -euo pipefail
          python3 tools/package_offline_pvpoke_assets.py
          PYTHONPATH=tools python3 -m unittest -q test_generate_hybrid_feed
          test -s app/src/main/assets/gamemaster.json
          test -s app/src/main/assets/pvpoke_snapshot.json
      - name: Recover verified ImageDB from last successful APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-apk app/src/main/assets
          gh run download 37974565481 -R LucianoToscano/PvPPokeGo-APK-Build --name PvPPokeGo-0.5.35-QA-debug --dir previous-apk
          PRIOR="previous-apk/PvPPokeGo-0.5.35-QA-debug.apk"
          test -s "$PRIOR"
          echo "4b52dc60ea7ee29da7363a3e061bb72d44aa1377cc1a1106d25b6a54f9257172  $PRIOR" | sha256sum -c -
          unzip -t "$PRIOR" >/dev/null
          for f in pokemon_visual_fingerprints.json pokemon_icon_atlas.png pokemon_icon_atlas.json; do
            unzip -p "$PRIOR" "assets/$f" > "app/src/main/assets/$f"
            test -s "app/src/main/assets/$f"
          done
      - name: Android JVM tests and R8 protected Release
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testStandardReleaseUnitTest :app:assembleStandardRelease
          test -s app/build/outputs/mapping/standardRelease/mapping.txt
      - name: Sign APK, verify v2+ and preserve hashes
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.PVPPKGO_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.PVPPKGO_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.PVPPKGO_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PVPPKGO_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.PVPPKGO_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$TOOLS/apksigner"
          test -x "$TOOLS/zipalign"
          UNSIGNED="app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk"
          test -s "$UNSIGNED"
          mkdir -p delivery
          KEYSTORE="$RUNNER_TEMP/pvppokego-friends.jks"
          KEY_ALIAS="pvppokego-friends"
          SIGNING_KIND="temporary-new-install-only"
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$STORE_PASS"
          if [[ -n "$RELEASE_KEYSTORE_B64" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            (umask 077; printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE")
            test -s "$KEYSTORE"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            STORE_PASS="$RELEASE_STORE_PASSWORD"
            KEY_PASS="$RELEASE_KEY_PASSWORD"
            SIGNING_KIND="configured-permanent-keystore"
          else
            keytool -genkeypair -noprompt -alias "$KEY_ALIAS" -storetype PKCS12 -keystore "$KEYSTORE" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=PvPPokeGo Friends Distribution, O=PvPPokeGo, C=BR"
          fi
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          echo "CHECKPOINT: zipalign completed"
          APK="delivery/PvPPokeGo-0.5.41-Amigos-protegido.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-verify.txt"
          echo "CHECKPOINT: apksigner verify completed"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-verify.txt"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-verify.txt" | head -1 | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT"
          if [[ "$SIGNING_KIND" == "configured-permanent-keystore" && -n "$EXPECTED_CERT_SHA256" ]]; then
            EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
            [[ "$CERT" == "$EXPECTED" ]] || { echo "::error::Certificado permanente nao confere"; exit 1; }
          fi
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          echo "CHECKPOINT: aapt badging completed"
          head -n 1 "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='com.lucianotoscano.pvppokego' versionCode='47' versionName='0.5.41-amigos'" "$RUNNER_TEMP/badging.txt"
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          ! grep -Eq 'android:debuggable.*0xffffffff|android:debuggable.*true' "$RUNNER_TEMP/manifest.txt"
          unzip -t "$APK" >/dev/null
          APK_CONTENTS="$(unzip -Z1 "$APK")"
          grep -Fq 'assets/gamemaster.json' <<< "$APK_CONTENTS"
          grep -Fq 'assets/pokemon_icon_atlas.png' <<< "$APK_CONTENTS"
          ! grep -Eq '(^|/)(mapping.txt|.*\\.jks|.*\\.java|.*\\.kt)
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          printf 'source=LucianoToscano/PvPPokeGo-APK-Build\nsource_commit=%s\nvariant=standardRelease\nversionName=0.5.41-amigos\nversionCode=47\nR8=true\nresource_shrinking=true\ncertificate_sha256=%s\nsigning=%s\n' "$GITHUB_SHA" "$CERT" "$SIGNING_KIND" > delivery/BUILD_PROVENANCE.txt
          if [[ "$SIGNING_KIND" == "temporary-new-install-only" ]]; then
            printf 'ATENCAO: assinatura temporaria nesta compilacao. Precisa desinstalar qualquer PvPPokeGo com assinatura diferente antes de instalar. Futuras versoes nao atualizarao automaticamente esta compilacao. Dados locais poderao ser perdidos na desinstalacao.\n' > delivery/INSTALLATION_NOTICE.txt
          else
            printf 'Assinado com keystore permanente configurada no CI. Confirmar compatibilidade com o APK instalado antes de atualizar.\n' > delivery/INSTALLATION_NOTICE.txt
          fi
      - name: Upload APK protegido e comprovantes - SEM FONTE
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.41-Amigos-protegido
          path: delivery/
          if-no-files-found: error
          retention-days: 30
 <<< "$APK_CONTENTS"
          echo "CHECKPOINT: APK contents verified"
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          printf 'source=LucianoToscano/PvPPokeGo-APK-Build\nsource_commit=%s\nvariant=standardRelease\nversionName=0.5.41-amigos\nversionCode=47\nR8=true\nresource_shrinking=true\ncertificate_sha256=%s\nsigning=%s\n' "$GITHUB_SHA" "$CERT" "$SIGNING_KIND" > delivery/BUILD_PROVENANCE.txt
          if [[ "$SIGNING_KIND" == "temporary-new-install-only" ]]; then
            printf 'ATENCAO: assinatura temporaria nesta compilacao. Precisa desinstalar qualquer PvPPokeGo com assinatura diferente antes de instalar. Futuras versoes nao atualizarao automaticamente esta compilacao. Dados locais poderao ser perdidos na desinstalacao.\n' > delivery/INSTALLATION_NOTICE.txt
          else
            printf 'Assinado com keystore permanente configurada no CI. Confirmar compatibilidade com o APK instalado antes de atualizar.\n' > delivery/INSTALLATION_NOTICE.txt
          fi
      - name: Upload APK protegido e comprovantes - SEM FONTE
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.41-Amigos-protegido
          path: delivery/
          if-no-files-found: error
          retention-days: 30
