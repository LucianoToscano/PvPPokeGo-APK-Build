<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font:11px Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
#panel{width:100%;background:rgba(10,13,19,.38);border:1px solid #ffffff40;border-radius:13px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 12px #0005}
#top{display:flex;align-items:center;gap:3px;padding:4px 4px 3px 24px;min-height:36px;user-select:none}
#grip{position:absolute;left:3px;top:7px;color:#d0d3dbb8;font-size:18px}
#top button{border:1px solid #ffffff30;background:#10151da8;border-radius:7px;min-width:22px;height:27px;padding:2px 4px;font-weight:700;font-size:10px;white-space:nowrap}
#top button.active{background:#ec2850c7;border-color:#ff5472}
#top button.shOn{color:#ffe4a0;border-color:#d8ae50;background:#534322a9}
#top .push{flex:1}
#status{padding:0 8px 3px;color:#e0e5ec9f;font-size:9px;height:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#items{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:4px 6px 6px;overflow:auto;max-height:112px}
#items.rows{display:block;max-height:90px}
.poke{background:#0b101878;border:1px solid #ffffff18;border-radius:7px;padding:1px;min-width:0;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.poke.sel{border-color:#ff5779}.poke img{width:30px;height:30px;object-fit:contain}.poke .tag{font-size:9px;line-height:10px;font-weight:700;color:#f4f6ff;white-space:nowrap}
.poke.row{min-height:37px;flex-direction:row;justify-content:flex-start;margin:0 0 3px;gap:5px;padding:2px 5px}
.rowText{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.tiny{font-size:9px;color:#d1d6df}
#empty{padding:6px 9px 9px;color:#f1f2f4b3;font-size:10px}
#details{margin:1px 6px 6px;padding:6px 7px;background:#090c11bb;border:1px solid #ffffff2c;border-radius:8px;font-size:10px;max-height:137px;overflow-y:auto}
#details header{display:flex;gap:4px;align-items:center;justify-content:space-between;font-size:11px}
#details .data{color:#dfe3ed;line-height:1.37;margin-top:3px}
#details .coords{background:#ee3150b9;border:0;border-radius:6px;width:100%;padding:5px;font-weight:bold;margin-top:4px}
#bubble{display:none;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff4d;background:#151820aa;align-items:center;justify-content:center;flex-direction:column}
#bubble b{font-size:17px;line-height:19px}#bubble small{font-size:10px;color:#ff7899}
</style></head><body>
<div id="panel">
 <span id="grip">⠿</span>
 <div id="top">
  <button id="iv" class="active" onclick="Native.select('iv')">100%</button>
  <button id="gl" onclick="Native.select('gl')">GL#1</button>
  <button id="sh" title="Alternar Shiny only" onclick="Native.shiny()">✨</button>
  <span class="push"></span>
  <button title="Atualizar" onclick="Native.refresh()">↻</button>
  <button id="view" title="Ícones / lista" onclick="Native.compact()">▦</button>
  <button title="Minimizar" onclick="Native.minimize()">−</button>
  <button title="Fechar" onclick="Native.close()">×</button>
 </div>
 <div id="status">Conectando...</div>
 <div id="items"></div><div id="details" style="display:none"></div>
 <div id="empty">Abra o app e faça login no PoGoCoordinates.</div>
</div>
<div id="bubble"><b>◉</b><small id="count">0</small></div>
<script>
let cards=[],mode='iv',shiny=true,compact=true,selected=-1,info='';
const safe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\u0027':'&#39;'}[c]));
const img=x=>(/^https:\/\//.test(x.image||'')?'<img src="'+safe(x.image)+'" alt="">':'<span style="font-size:24px">◉</span>');
function line(x){return '<b>'+safe(x.name)+(x.shiny?' ✨':'')+'</b><br><span class="tiny">PC '+safe(x.cp||'—')+' · Nv '+safe(x.level||'—')+' · '+safe(x.ivPercent?x.ivPercent+'%':'IV ?')+'</span>';}
function badge(x){return safe(x.ivPercent?x.ivPercent+'%':mode==='gl'?'GL':'IV?');}
function setHeight(){
 requestAnimationFrame(()=>{
  const panel=document.getElementById('panel');
  if(panel.style.display!=='none')Native.resize(Math.ceil(panel.getBoundingClientRect().height)+3);
 });
}
function draw(){
 document.getElementById('iv').classList.toggle('active',mode==='iv');
 document.getElementById('gl').classList.toggle('active',mode==='gl');
 document.getElementById('sh').classList.toggle('shOn',shiny);
 document.getElementById('view').textContent=compact?'▦':'▤';
 document.getElementById('status').textContent=info||'Aguardando resultados...';
 document.getElementById('count').textContent=cards.length;
 const holder=document.getElementById('items');
 holder.className=compact?'':'rows';
 holder.innerHTML=cards.map((x,i)=>'<button class="poke '+(compact?'':'row ')+(selected===i?'sel':'')+'" onclick="pick('+i+')">'+img(x)+(compact?'<span class="tag">'+badge(x)+(x.shiny?' ✨':'')+'</span>':'<span class="rowText">'+line(x)+'</span>')+'</button>').join('');
 document.getElementById('empty').style.display=cards.length?'none':'block';
 const d=document.getElementById('details'),x=cards[selected];
 if(!x){d.style.display='none';}else{
  d.style.display='block';
  const fact=(v,label)=>v?'<div>'+label+': '+safe(v)+'</div>':'';
  d.innerHTML='<header><strong>'+safe(x.name)+(x.shiny?' ✨':'')+'</strong><span>'+safe(x.number||'')+' '+safe(x.gender||'')+' '+safe(x.size||'')+'</span></header>'+
  '<div class="data">'+fact(x.form,'Forma')+fact(x.cp,'PC')+fact(x.level,'Nível')+
  fact(x.ivPercent?(x.ivPercent+'%'+(x.iv?' ('+x.iv+')':'')):x.iv,'IV')+
  fact(x.rank,'Rank')+fact(x.moves,'Golpes')+fact(x.location,'Local')+fact(x.despawn,'Despawn')+
  fact(x.coords,'Coords')+'</div>'+
  '<button class="coords" onclick="Native.coords('+x.sourceIndex+')">⌖ Get coords</button>';
 }
 setHeight();
}
function pick(i){selected=i===selected?-1:i;draw();}
window.onNativeData=function(items,status,m,s,c){
 cards=Array.isArray(items)?items.slice(0,10):[];
 info=String(status||'');mode=m;shiny=!!s;compact=!!c;
 if(selected>=cards.length)selected=-1;draw();
};
window.setMinimized=function(value){
 document.getElementById('panel').style.display=value?'none':'block';
 document.getElementById('bubble').style.display=value?'flex':'none';
 if(!value)draw();
};
draw();
</script></body></html>
