<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--row:36px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:white;font-family:Roboto,Arial,sans-serif;font-size:10px;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#shell{width:100%;background:rgba(12,17,24,.35);border:1px solid #ffffff42;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px #0003;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#handle{height:21px;text-align:left;padding-left:6px;padding-top:1px;color:#e3e6ee88;font-weight:700;letter-spacing:2px;font-size:15px;user-select:none;line-height:20px}
#controls{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:0 4px 4px}
#controls button{height:22px;border-radius:6px;border:1px solid #ffffff20;background:#131722a8;font-size:10px;font-weight:700;padding:0 3px}
#controls button.active{background:#ef294dbb;border-color:#ff8aa0a1}
#controls button.shinyOn{color:#ffe6a1;background:#5745228f;border-color:#e8c45d9e}
#actions{display:flex;flex-direction:column;gap:2px}
#actions button{height:21px;font-size:13px}
#status{margin:0 3px 2px;padding:2px 1px;font-size:9px;color:#eff2f5b0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #ffffff24}
#spawns{display:flex;flex-direction:column;gap:1px;padding:1px 3px 4px;overflow:visible}
.spawn{width:100%;height:var(--row);min-height:0;display:flex;align-items:center;justify-content:flex-start;gap:2px;background:#11172257;border-radius:6px;border:1px solid transparent;padding:0 2px;overflow:hidden}
.spawn.active{border-color:#ff53769a;background:#4b24309a}
.sprite{width:calc(var(--row) - 5px);height:calc(var(--row) - 5px);min-width:0;max-width:38px;object-fit:contain}
.ivbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:center;align-items:center;justify-content:center;color:#f0f3f9;font-size:10px;font-weight:700;line-height:10px;letter-spacing:-.5px}
.ivbox .rank{font-size:8px;color:#cdd4e5;letter-spacing:0}
#empty{font-size:9px;line-height:1.4;color:#e3e5eebb;padding:5px 3px 8px;text-align:center;overflow-wrap:anywhere}
#bubble{width:45px;height:45px;border:1px solid #ffffff70;background:#1b1c28bf;box-shadow:0 3px 12px #0006;border-radius:50%;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1px}
#bubble b{font-size:18px;line-height:18px}#bubble small{font-size:10px;font-weight:bold;color:#ff839a}
</style></head><body>
<div id="shell">
 <div id="handle">⠿</div>
 <div id="controls">
   <button id="iv" onclick="Native.select('iv')">IV100</button>
   <button id="gl" onclick="Native.select('gl')">GL#1</button>
   <button id="sh" title="Shiny only" onclick="Native.shiny()">✨</button>
   <div id="actions">
    <button title="Atualizar" onclick="Native.refresh()">↻</button>
    <button title="Minimizar" onclick="Native.minimize()">−</button>
    <button title="Fechar" onclick="Native.close()">×</button>
   </div>
 </div>
 <div id="status">Aguardando</div>
 <div id="spawns"></div>
 <div id="empty">Faça login no aplicativo</div>
</div>
<div id="bubble"><b>◉</b><small id="count">0</small></div>
<script>
let cards=[],active=-1,mode="iv",shiny=true,status="",row=36;
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function badge(c){
 const iv=c.ivPercent?c.ivPercent+"%":"IV?";
 if(mode==="gl")return '<span>'+h(iv)+'</span><span class="rank">'+h(c.rank?"R"+c.rank:"GL")+'</span>';
 return '<span>'+h(iv)+'</span>';
}
function draw(){
 document.documentElement.style.setProperty("--row",row+"px");
 document.getElementById("iv").classList.toggle("active",mode==="iv");
 document.getElementById("gl").classList.toggle("active",mode==="gl");
 document.getElementById("sh").classList.toggle("shinyOn",shiny);
 document.getElementById("count").textContent=String(cards.length);
 document.getElementById("status").textContent=cards.length?cards.length+"/10":(status||"Sem resultados");
 document.getElementById("spawns").innerHTML=cards.map((c,i)=>{
  const src=/^https:\/\//.test(c.image||"")?'<img class="sprite" src="'+h(c.image)+'" alt="'+h(c.name)+'">':'<span class="sprite">◉</span>';
  return '<button aria-label="'+h(c.name)+' IV '+h(c.ivPercent)+'" class="spawn '+(active===i?"active":"")+'" onclick="Native.toggleDetail('+i+')">'+src+'<span class="ivbox">'+badge(c)+'</span></button>';
 }).join("");
 document.getElementById("empty").style.display=cards.length?"none":"block";
 requestAnimationFrame(()=>Native.resize(Math.ceil(document.getElementById("shell").getBoundingClientRect().height)+1));
}
window.onNativeData=(a,s,m,shi,r)=>{
 cards=Array.isArray(a)?a.slice(0,10):[];
 mode=m;status=String(s||"");shiny=!!shi;row=Number(r)||36;
 if(active>=cards.length)active=-1;
 draw();
};
window.highlight=i=>{active=i;document.querySelectorAll(".spawn").forEach((e,index)=>e.classList.toggle("active",index===i));};
window.setMinimized=value=>{
 document.getElementById("shell").style.display=value?"none":"block";
 document.getElementById("bubble").style.display=value?"flex":"none";
 if(!value)draw();
};
draw();
</script></body></html>
