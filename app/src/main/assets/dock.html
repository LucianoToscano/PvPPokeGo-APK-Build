<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--row:46px;--sprite:45px;--dock:53px;--top-space:0px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent!important;color:#fff;font:10px Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#shell{position:relative;width:var(--dock);padding-top:var(--top-space);background:transparent!important;border:0;border-radius:0;box-shadow:none;overflow:visible}
#gear{width:28px;height:21px;margin:0 auto;padding:0;border:0;background:transparent;color:#e9ecf1;display:flex;align-items:center;justify-content:center}
#gear svg{display:block;width:21px;height:21px;filter:drop-shadow(0 1px 1px #0007)}
#gear.busy svg{animation:gearbusy 1.25s linear infinite}
@keyframes gearbusy{to{transform:rotate(360deg)}}
#menu{display:none;position:absolute;top:var(--top-space);left:var(--dock);width:258px;height:25px;z-index:3;padding:0 2px;border:0;border-radius:0;background:transparent;box-shadow:none}
#menu.open{display:block}
body.menu-left #shell{margin-left:258px}
body.menu-left #menu{left:-258px}
#controls{width:254px;display:grid;grid-template-columns:36px 23px 43px 22px 22px 23px 23px 23px 23px;gap:2px;padding:0;margin:0;align-items:center}
body.menu-left #controls{direction:rtl}
#controls button{direction:ltr}
#controls button{height:25px;width:100%;min-width:0;padding:0;background:#151b26e6;border:1px solid #ffffff23;border-radius:5px;font-size:10px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;white-space:nowrap}
#controls button.active{background:#db2d4bdb}
#controls #cycle.ivOn{background:#136b3bdf;border-color:#69df97a6;color:#e9fff2}
#gear .gear-icon{display:block}
#gear .close-icon{display:none}
#topActions{position:absolute;top:0;left:calc((var(--dock) - 27px) / 2);width:27px;display:none;flex-direction:column;gap:1px;z-index:4}
body.menu-open #topActions{display:flex}
#topActions button{width:27px;height:16px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;filter:drop-shadow(0 1px 2px #000a)}
#topActions button svg{width:16px;height:16px;display:block}
#topActions #close{background:transparent;border:0;color:#ff566e;font-size:19px;font-weight:700}
#topActions #collapse{color:#e5eef8}
#controls #bell.generalOn{background:#1d5b49dc;border-color:#69dbab77;color:#ddfff1}
#controls #star.favoritesOn{background:#70561de0;border-color:#ffe29a77;color:#ffdf74}
#controls #star svg{width:17px;height:17px}
#controls #donate{color:#fa94a7}
#controls button svg{width:16px;height:16px;display:block;pointer-events:none}
#controls #cycle{font-size:11px;font-weight:800}
#controls #cycle .league{display:inline-flex;gap:2px;align-items:center;justify-content:center}
#controls #cycle .league svg{width:16px;height:16px}
#controls #size{font-size:12px!important;font-weight:800}
#controls button.shinyOn{color:#ffe5a0;background:#564627e9}
#actions{display:contents}
#actions button{font-size:16px;font-weight:500}
#period{display:flex;flex-direction:column;gap:1px;line-height:1!important;padding:2px 0!important}
#period .autoLabel{font-size:8px;font-weight:800;letter-spacing:0.25px;opacity:.85}
#period .autoTime{font-size:10px;font-weight:800}
#clock.timerOn{background:#76601ccf;border-color:#ffe5a04d;color:#ffe5a0}
#spawns{width:var(--dock);display:flex;flex-direction:column;align-items:center;gap:0;padding:0;margin:-2px 0 0}
.spawn{width:var(--dock);height:var(--row);position:relative;min-height:var(--row);display:flex;align-items:center;justify-content:center;margin:0;padding:0;background:transparent;border:0;border-radius:4px}
.spawn.active .sprite{filter:drop-shadow(0 0 3px #ffffff77)}
.timer{position:absolute;right:0;bottom:0;padding:1px 2px;border-radius:3px;background:#111924c4;color:#fff;font-size:8px;line-height:10px;pointer-events:none;min-width:23px;text-align:center}
.spawn.expired{opacity:.38}
.sprite{display:block;width:var(--sprite);height:var(--sprite);object-fit:contain;flex-shrink:0;pointer-events:none;filter:drop-shadow(0 1px 1px #0006)}
.fallback{font-size:20px}
#empty{display:block;width:var(--dock);height:18px;line-height:18px;text-align:center;color:#dce1e9b8;font-size:12px;overflow:hidden}
#bubble{display:none;width:45px;height:45px;border:0;background:transparent;box-shadow:none;border-radius:0;align-items:center;justify-content:center}
#bubble svg{width:20px;height:20px;color:#e9ecf1;filter:drop-shadow(0 1px 1px #0009)}
</style></head><body>
<div id="shell">
 <button id="gear" title="Abrir opções · arrastar para mover" aria-label="Abrir opções" aria-expanded="false"><svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96c-.5-.38-1.03-.69-1.64-.93L14.36 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4l-.36 2.53c-.6.24-1.15.56-1.64.93l-2.39-.96a.49.49 0 0 0-.61.22L2.62 8.84a.5.5 0 0 0 .12.64l2.02 1.58c-.04.3-.07.62-.07.94s.03.64.08.94L2.74 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.49.38 1.04.7 1.64.93l.36 2.53c.04.24.24.4.49.4h3.84c.25 0 .45-.16.49-.4l.36-2.53c.6-.24 1.15-.55 1.64-.93l2.39.96c.23.09.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.56ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button>
 <div id="menu"><div id="controls">
  <button id="cycle" title="Alternar IV100, Grande Liga #1, Ultra Liga #1" onclick="Native.cycleMode()">100%</button>
  <button id="sh" title="Shiny only · ativação opcional" onclick="Native.shiny()">✨</button>
  <button id="period" title="Atualização automática" aria-label="Atualização automática, 5 minutos" onclick="Native.cycleInterval()"><span class="autoLabel">AUTO</span><span class="autoTime">5m</span></button>
  <button id="manualRefresh" title="Atualizar resultados agora" onclick="Native.refresh()">↻</button>
  <button id="size" title="Tamanho P / M / G" onclick="Native.cycleSpriteSize()">M</button>
  <button id="clock" title="Mostrar ou ocultar tempo de despawn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
  <button id="bell" title="Notificações de novos Pokémon · toque para ativar/desativar" aria-pressed="false" onclick="Native.toggleGeneralAlerts()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button>
  <button id="star" title="Meus favoritos · alertas específicos IV100 / GL#1 / UL#1" onclick="Native.openWatchList()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.4 7.1 1-5.1 4.9 1.2 7-6.3-3.3-6.3 3.3 1.2-7L1.8 9.4l7.1-1L12 2Z"/></svg></button>
  <button id="donate" title="Gostou do PokeSearch? Apoie com um café · Pix voluntário" onclick="Native.openPix()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg></button>
 </div></div>
 <div id="topActions">
  <button id="close" title="Fechar todo o overlay" aria-label="Encerrar overlay" onclick="Native.close()">×</button>
  <button id="collapse" title="Recolher tudo e deixar apenas a engrenagem" aria-label="Minimizar overlay" onclick="Native.minimize()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="14" rx="2"/><path d="m9 11 3 3 3-3"/></svg></button>
 </div>
 <div id="spawns"></div>
 <div id="empty">Aguardando busca</div>
</div>
<div id="bubble" role="button" aria-label="Restaurar overlay"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96c-.5-.38-1.03-.69-1.64-.93L14.36 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4l-.36 2.53c-.6.24-1.15.56-1.64.93l-2.39-.96a.49.49 0 0 0-.61.22L2.62 8.84a.5.5 0 0 0 .12.64l2.02 1.58c-.04.3-.07.62-.07.94s.03.64.08.94L2.74 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.49.38 1.04.7 1.64.93l.36 2.53c.04.24.24.4.49.4h3.84c.25 0 .45-.16.49-.4l.36-2.53c.6-.24 1.15-.55 1.64-.93l2.39.96c.23.09.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.56ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></div>
<script>
let cards=[],active=-1,mode="iv",shiny=false,status="",row=46,menuOpen=false,period=5,spriteSize=45,showTimers=false,generalAlerts=false,hasFavorites=false;
function setMenuOpen(open,side,pad){
 menuOpen=!!open;
 document.documentElement.style.setProperty("--top-space",menuOpen?((Number(pad)||54)+"px"):"0px");
 document.body.classList.toggle("menu-open",menuOpen);
 document.getElementById("menu").classList.toggle("open",menuOpen);
 document.getElementById("gear").setAttribute("aria-expanded",String(menuOpen));
 document.getElementById("gear").setAttribute("aria-label",menuOpen?"Recolher opções":"Abrir opções");
 if(!menuOpen)document.body.classList.remove("menu-left");
 else if(side)document.body.classList.toggle("menu-left",side==="left");
}
window.syncMenu=(open,side,pad)=>setMenuOpen(open,side,pad);
let lastHeight=0;function fit(){requestAnimationFrame(()=>{const h=Math.ceil(document.getElementById("shell").getBoundingClientRect().height)+1;if(Math.abs(h-lastHeight)>1){lastHeight=h;Native.resize(h);}});}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let longTimer, longDone=false;
function spriteClick(i){if(longDone){longDone=false;return;}Native.toggleDetail(i);}
function attachLongPress(){
 document.querySelectorAll('.spawn').forEach(el=>{
  const i=Number(el.dataset.index);
  el.addEventListener('touchstart',()=>{longDone=false;clearTimeout(longTimer);longTimer=setTimeout(()=>{longDone=true;Native.longPressCoords(i);},580);},{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(t=>el.addEventListener(t,()=>clearTimeout(longTimer),{passive:true}));
  el.addEventListener('contextmenu',e=>{e.preventDefault();longDone=true;Native.longPressCoords(i)});
 });
}
let lastListKey="";
function draw(){
 document.documentElement.style.setProperty("--row",row+"px");
 document.documentElement.style.setProperty("--sprite",spriteSize+"px");
 document.documentElement.style.setProperty("--dock",(spriteSize+8)+"px");
 const cy=document.getElementById("cycle");
 if(mode==="iv"){cy.textContent="100%";cy.classList.add("ivOn");cy.title="IV100 · 15/15/15";}
 else{
   const gl=mode==="gl",color=gl?"#2f8ed8":"#d8ad43";
   cy.innerHTML='<span class="league"><svg viewBox="0 0 24 24" aria-hidden="true">'+
   '<circle cx="12" cy="12" r="10.5" fill="'+color+'" stroke="#fff" stroke-width="1.2"/>'+
   '<path d="M3 12h18" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="#fff" stroke="'+color+'" stroke-width="1.5"/></svg>#1</span>';
   cy.classList.remove("ivOn");
   cy.title=gl?"Grande Liga · ranking #1":"Ultra Liga · ranking #1";
 }
 document.getElementById("size").textContent=spriteSize<=35?"P":spriteSize>=55?"G":"M";
 document.getElementById("sh").classList.toggle("shinyOn",shiny);
 document.getElementById("sh").setAttribute("aria-pressed",String(shiny));
 document.getElementById("sh").title=shiny?"Shiny ativado · tocar para desativar":"Shiny desativado · tocar para ativar no site (pode solicitar login)";
 document.getElementById("clock").classList.toggle("timerOn",showTimers);
 const bell=document.getElementById("bell");
 bell.classList.toggle("generalOn",generalAlerts);
 bell.setAttribute("aria-pressed",String(generalAlerts));
 bell.title=generalAlerts?"Novos Pokémon: notificações ativadas":"Novos Pokémon: notificações desativadas";
 const star=document.getElementById("star");
 star.classList.toggle("favoritesOn",hasFavorites);
 star.title=hasFavorites?"Editar favoritos e alertas específicos":"Adicionar Pokémon favoritos e alertas específicos";
 const p=document.getElementById("period");p.querySelector(".autoTime").textContent=String(period)+"m";p.title="Atualização automática a cada "+period+" minutos · toque para alterar";p.setAttribute("aria-label","Atualização automática a cada "+period+" minutos");
 const listKey=JSON.stringify([cards,row,spriteSize,showTimers]);
 if(listKey!==lastListKey){lastListKey=listKey;
 document.getElementById("spawns").innerHTML=cards.map((c,i)=>{
  const label=[c.name,c.ivPercent?c.ivPercent+"%":"IV não disponível",c.iv,c.rank?"Rank "+c.rank:""].filter(Boolean).join(" · ");
  const icon=/^(https:\/\/|data:image\/(?:png|webp|gif|jpeg);base64,)/i.test(c.image||"")?'<img class="sprite" src="'+esc(c.image)+'" alt="" loading="eager">':'<span class="fallback">◉</span>';
  const kind=(c.shiny?"shiny":mode),deadline=Number(c.expiresAtMs)||0;
  const badge=showTimers&&deadline?'<span class="timer" data-deadline="'+deadline+'"></span>':"";
  return '<button title="'+esc(label)+'" aria-label="'+esc(label)+'" class="spawn '+esc(kind)+(active===i?" active":"")+'" data-index="'+i+'" onclick="spriteClick('+i+')" oncontextmenu="return false">'+icon+badge+'</button>';
 }).join("");
 attachLongPress();
 updateTimers();
 }
 const empty=document.getElementById("empty");
 empty.style.display=cards.length?"none":"block";
 empty.textContent=/sem resultados/i.test(status)?"0":/falha|erro|não|login/i.test(status)?"!":"…";
 empty.title=status||"Aguardando busca";
 document.getElementById("gear").title=menuOpen?"Recolher menu · arrastar para mover":status?("Abrir menu · "+status):"Abrir menu · arrastar para mover";
 document.getElementById("gear").classList.toggle("busy",/(atualizando|buscando|busca manual|pesquisa)/i.test(status));
 fit();
}
function updateTimers(){
 document.querySelectorAll(".timer").forEach(e=>{
  const deadline=Number(e.dataset.deadline),seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  e.textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
  e.parentElement.classList.toggle("expired",seconds===0);
 });
}
setInterval(updateTimers,1000);
window.onNativeData=(a,s,m,shi,r,interval,sprite,timers,borders,general,hasFav)=>{
 cards=Array.isArray(a)?a.slice(0,10):[];
 mode=m;status=String(s||"");shiny=!!shi;row=Number(r)||46;period=Number(interval)||5;spriteSize=Number(sprite)||45;showTimers=!!timers;generalAlerts=!!general;hasFavorites=!!hasFav;
 if(active>=cards.length)active=-1;
 draw();
};
window.menuSide=side=>document.body.classList.toggle("menu-left",menuOpen&&side==="left");
window.highlight=i=>{active=i;document.querySelectorAll(".spawn").forEach((e,index)=>e.classList.toggle("active",index===i));};
window.setMinimized=value=>{
 document.getElementById("shell").style.display=value?"none":"block";
 if(value)setMenuOpen(false);
 document.getElementById("bubble").style.display=value?"flex":"none";
 if(!value)draw();
};
document.getElementById("clock").addEventListener("click",()=>Native.toggleTimers());
draw();
</script></body></html>
