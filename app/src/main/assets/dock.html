<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--row:36px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:#fff;font-family:Roboto,Arial,sans-serif;font-size:10px;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#shell{width:100%;background:rgba(11,16,23,.23);border:1px solid #ffffff35;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0003;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#handle{height:17px;text-align:left;padding:0 0 0 5px;color:#dce2ecae;font-size:15px;line-height:17px;letter-spacing:1px;user-select:none}
#controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:0 3px 3px}
#controls button{height:23px;min-height:23px;min-width:0;border-radius:5px;border:1px solid #ffffff21;background:#151b25a3;font-size:9px;font-weight:700;white-space:nowrap;padding:0 2px}
#controls button.active{background:#e9294bb3;border-color:#fb718a7d}
#controls button.shinyOn{color:#ffe4a0;background:#58452280;border-color:#d9b35b91}
#actions{display:contents}
#actions button{height:23px;min-height:23px;font-size:13px}
#spawns{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 2px 3px}
.spawn{width:100%;height:var(--row);display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:6px;padding:1px}
.spawn.active{border-color:#ff6b86a9;background:#53303955}
.sprite{display:block;width:min(calc(var(--row) - 2px),39px);height:min(calc(var(--row) - 2px),39px);object-fit:contain;filter:drop-shadow(0 1px 2px #0005)}
.fallback{font-size:22px;line-height:1}
#empty{color:#dce4eda9;text-align:center;padding:4px 2px 7px;font-size:9px;line-height:1.4;overflow-wrap:anywhere}
#bubble{display:none;width:45px;height:45px;border:1px solid #ffffff70;background:#1b1c28bf;box-shadow:0 3px 12px #0006;border-radius:50%;align-items:center;justify-content:center;flex-direction:column;gap:1px}
#bubble b{font-size:18px;line-height:18px}#bubble small{font-size:10px;font-weight:bold;color:#ff839a}
</style></head><body>
<div id="shell">
 <div id="handle">⠿</div>
 <div id="controls">
   <button id="iv" title="Filtrar IV 100%" onclick="Native.select('iv')">IV100</button>
   <button id="gl" title="Filtrar Grande Liga rank 1" onclick="Native.select('gl')">GL#1</button>
   <button id="sh" title="Ativar/desativar Shiny" onclick="Native.shiny()">✨</button>
   <div id="actions">
    <button title="Atualizar" onclick="Native.refresh()">↻</button>
    <button title="Minimizar" onclick="Native.minimize()">−</button>
    <button title="Fechar" onclick="Native.close()">×</button>
   </div>
 </div>
 <div id="spawns"></div>
 <div id="empty">Aguardando busca</div>
</div>
<div id="bubble"><b>◉</b><small id="count">0</small></div>
<script>
let cards=[],active=-1,mode="iv",shiny=true,status="",row=36;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function draw(){
 document.documentElement.style.setProperty("--row",row+"px");
 document.getElementById("iv").classList.toggle("active",mode==="iv");
 document.getElementById("gl").classList.toggle("active",mode==="gl");
 document.getElementById("sh").classList.toggle("shinyOn",shiny);
 document.getElementById("count").textContent=String(cards.length);
 document.getElementById("spawns").innerHTML=cards.map((c,i)=>{
  const label=[c.name,c.ivPercent?c.ivPercent+"%":"IV não disponível",c.iv,c.rank?"Rank "+c.rank:""].filter(Boolean).join(" · ");
  const icon=/^https:\/\//.test(c.image||"")?'<img class="sprite" src="'+esc(c.image)+'" alt="">':'<span class="fallback">◉</span>';
  return '<button title="'+esc(label)+'" aria-label="'+esc(label)+'" class="spawn '+(active===i?"active":"")+'" onclick="Native.toggleDetail('+i+')">'+icon+'</button>';
 }).join("");
 const empty=document.getElementById("empty");
 empty.style.display=cards.length?"none":"block";
 empty.textContent=status||"Sem resultados";
 requestAnimationFrame(()=>Native.resize(Math.ceil(document.getElementById("shell").getBoundingClientRect().height)+1));
}
window.onNativeData=(a,s,m,shi,r)=>{
 cards=Array.isArray(a)?a.slice(0,10):[];
 mode=m;status=String(s||"");shiny=!!shi;row=Number(r)||36;
 if(active>=cards.length)active=-1;
 draw();
};
window.highlight=i=>{active=i;document.querySelectorAll(".spawn").forEach((e,index)=>e.classList.toggle("active",index===i));};
window.setMinimized=value=>{
 document.getElementById("shell").style.display=value?"none":"block";
 document.getElementById("bubble").style.display=value?"flex":"none";
 if(!value)draw();
};
draw();
</script></body></html>
